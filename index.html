<!doctype html>

    <meta name="description" content="Nexlifie — Innovate, Build, Grow. Premium software development, AI solutions, and digital automation for modern businesses." />
    <title>Nexlifie — Innovate, Build, Grow</title>
    <!-- GitHub Pages SPA redirect: converts ?/path back to /path for React Router -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-[#020202]">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
