<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nexlifie</title>
  <!--
    GitHub Pages SPA workaround.
    When a user navigates directly to a deep URL like nexlifie.com/services,
    GitHub Pages serves this 404.html instead. This script redirects them back
    through the root /?/services so React Router can handle it.
    Source: https://github.com/rafgraph/spa-github-pages
  -->
  <script type="text/javascript">
    var pathSegmentsToKeep = 0;
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>
